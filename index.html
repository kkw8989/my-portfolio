<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김경우 포트폴리오</title>
<meta name="description" content="업무의 흐름을 이해하고 기술로 문제를 해결하는 개발자 김경우의 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f4f5f7;--ink:#12203a;--mute:#5b6475;--line:#e2e5ea;--accent:#0e7c66}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
header b{font-weight:700;text-decoration:none}
nav{display:flex;gap:22px;font-size:14px}
nav a{text-decoration:none;color:var(--mute)}
nav a:hover{color:var(--ink)}
.hero{padding:120px 0 88px}
h1{font-size:clamp(30px,5.4vw,50px);line-height:1.3;margin:0 0 28px;font-weight:700;letter-spacing:-.02em}
.lead{max-width:600px;color:var(--mute);margin:0 0 36px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 22px;border:1px solid var(--ink);border-radius:6px;text-decoration:none;font-weight:500;font-size:15px}
.btn.fill{background:var(--ink);color:#fff}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font-size:24px;margin:0 0 32px;font-weight:700}
h3{font-size:17px;margin:36px 0 10px}
p{margin:0 0 14px}
.soft{background:var(--soft)}
.row{display:block;padding:28px 0;border-top:1px solid var(--line);text-decoration:none}
.row:last-child{border-bottom:1px solid var(--line)}
.row h3{margin:0 0 4px;font-size:20px}
.row:hover h3{color:var(--accent)}
.sub{color:var(--mute);margin:0 0 10px}
.key{font-weight:500;color:var(--accent);margin:0 0 10px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tags span{font-size:13px;padding:2px 10px;background:var(--soft);border-radius:4px;color:var(--mute)}
.badge{font-size:13px;color:var(--accent);font-weight:500;margin-left:10px}
.grid{display:grid;grid-template-columns:140px 1fr;gap:20px 24px}
.grid dt{font-weight:700}
.grid dd{margin:0}
.sk{display:flex;flex-wrap:wrap;gap:6px 24px}
.sk div{min-width:200px}
.sk small{display:block;color:var(--mute);font-size:13px;line-height:1.5}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:140px 1fr;gap:4px 24px;padding:16px 0;border-top:1px solid var(--line)}
.tl em{font-style:normal;color:var(--mute);font-size:14px}
.tl b{font-weight:500}
.tl span{grid-column:2;color:var(--mute);font-size:15px}
ul{padding-left:20px;margin:0 0 14px}
li{margin-bottom:6px}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:0;list-style:none}
.flow li{margin:0;padding:6px 14px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--soft)}
.note{border-left:3px solid var(--accent);padding:4px 16px;color:var(--mute);margin:20px 0}
.back{display:inline-block;margin:36px 0 0;color:var(--mute);text-decoration:none;font-size:14px}
.detail{padding:48px 0 96px}
footer{padding:36px 0;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:640px){nav{gap:14px}.grid,.tl li{grid-template-columns:1fr}.tl span{grid-column:1}.hero{padding:72px 0 56px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 여기만 고치면 됩니다 (프로젝트, 기술, 경험, 연락처 데이터) ===== */

      links: { github: "", demo: "" }
    }
  ],
  skills: [
    { group: "백엔드", items: [["Java", "Re:Mate, MoneyBridge"], ["Spring Boot", "Re:Mate, MoneyBridge, 영어 단어 학습"], ["Spring Security, JWT", "영어 단어 학습, Re:Mate(RBAC)"], ["Python, Flask", "파프리카"]] },

    { group: "AI 및 OCR", items: [["Google OCR, Gemini", "Re:Mate 연계 및 정확도 검증"], ["OpenAI GPT-4o Vision", "파프리카"]] },
    { group: "도구 및 배포", items: [["Git, GitHub", "전체 프로젝트"], ["AWS", "MoneyBridge 배포"], ["Render", "Re:Mate 배포"], ["Gradle, Swagger", "Re:Mate"]] }
  ],

    { when: "", title: "캡스톤 디자인 입선", tag: "수상", desc: "Sortify 팀, 졸업프로젝트 Re:Mate" },
    { when: "", title: "풀스택 웹개발 교육 과정", tag: "교육", desc: "React, Java, Spring Boot, 데이터베이스, AWS 배포, 팀 프로젝트 2건" },

/* ===== 아래는 화면 코드입니다 ===== */
const app = document.getElementById("app");
const tags = a => `<div class="tags">${a.map(x => `<span>${x}</span>`).join("")}</div>`;
const ul = a => `<ul>${a.map(x => `<li>${x}</li>`).join("")}</ul>`;
const D = DATA, C = D.contact;
const head = `<header><div class="wrap"><b><a href="#" style="text-decoration:none">${D.profile.name}</a></b><nav><a href="#about">소개</a><a href="#projects">프로젝트</a><a href="#skills">기술</a><a href="#timeline">경험</a><a href="#contact">연락</a></nav></div></header>`;

function home() {
  const rows = D.projects.map(p => `<a class="row" href="#p/${p.id}"><h3>${p.name}${p.featured ? '<span class="badge">대표 프로젝트</span>' : ""}</h3><p class="sub">${p.subtitle}</p><p class="key">${p.key}</p>${tags(p.stack.slice(0, 6))}</a>`).join("");
  const sk = D.skills.map(g => `<dt>${g.group}</dt><dd><div class="sk">${g.items.map(i => `<div>${i[0]}<small>${i[1]}</small></div>`).join("")}</div></dd>`).join("");
  const tl = D.timeline.map(t => `<li><em>${t.when || t.tag}</em><b>${t.title}</b><span>${t.desc}</span></li>`).join("");
  const links = [C.email && `<a class="btn" href="mailto:${C.email}">이메일 보내기</a>`, C.resume && `<a class="btn" href="${C.resume}">이력서 PDF 보기</a>`].filter(Boolean).join("");
  return `${head}<main>
  <div class="wrap hero"><h1>${D.profile.headline}</h1><p class="lead">${D.profile.intro}</p>
  <div class="btns"><a class="btn fill" href="#projects">프로젝트 보기</a><a class="btn" href="${C.github}" target="_blank" rel="noopener">GitHub 방문하기</a></div></div>
  <section id="about" class="soft"><div class="wrap"><h2>소개</h2>${D.profile.about.map(t => `<p>${t}</p>`).join("")}</div></section>
  <section id="projects"><div class="wrap"><h2>프로젝트</h2>${rows}</div></section>
  <section id="skills" class="soft"><div class="wrap"><h2>기술 스택</h2><dl class="grid">${sk}</dl></div></section>
  <section id="timeline"><div class="wrap"><h2>경험과 학력</h2><ul class="tl">${tl}</ul></div></section>
  <section id="contact" class="soft"><div class="wrap"><h2>연락하기</h2><p>프로젝트나 협업에 관심이 있으시면 편하게 연락해 주세요.</p><div class="btns"><a class="btn fill" href="${C.github}" target="_blank" rel="noopener">GitHub</a>${links}</div></div></section>
  </main><footer><div class="wrap">${D.profile.name} 포트폴리오</div></footer>`;
}

function detail(p) {
  const sec = (t, body) => body ? `<h3>${t}</h3>${body}` : "";
  const l = [p.links.github && `<a class="btn" href="${p.links.github}" target="_blank" rel="noopener">GitHub</a>`, p.links.demo && `<a class="btn" href="${p.links.demo}" target="_blank" rel="noopener">서비스 보기</a>`].filter(Boolean).join("");
  return `${head}<main class="wrap detail"><a class="back" href="#projects">프로젝트 목록으로</a>
  <h1 style="margin-top:20px;font-size:clamp(28px,4.6vw,40px)">${p.name}</h1><p class="sub">${p.subtitle}</p>
  <dl class="grid" style="margin:24px 0 0"><dt>팀 구성</dt><dd>${p.team}</dd>${p.period ? `<dt>기간</dt><dd>${p.period}</dd>` : ""}<dt>기술</dt><dd>${p.stack.join(", ")}</dd></dl>
  ${sec("문제와 목표", `<p>${p.problem}</p>`)}
  ${sec("내가 맡은 일", ul(p.mine))}
  ${p.note ? `<p class="note">${p.note}</p>` : ""}
  ${p.flow ? sec("처리 흐름", `<ol class="flow">${p.flow.map(x => `<li>${x}</li>`).join("")}</ol>`) : ""}
  ${sec("문제 해결 과정", p.fix && ul(p.fix))}
  ${sec("결과", p.result && ul(p.result))}
  ${sec("다음 개선", p.next && `<p>${p.next}</p>`)}
  ${l ? `<div class="btns" style="margin-top:32px">${l}</div>` : ""}</main>`;
}

let view = "";
function route() {
  const m = location.hash.match(/^#p\/(.+)$/), p = m && D.projects.find(x => x.id === m[1]);
  const next = p ? "p:" + p.id : "home";
  if (next !== view) { app.innerHTML = p ? detail(p) : home(); view = next; if (p) window.scrollTo(0, 0); }
  if (!p) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); else if (!location.hash) window.scrollTo(0, 0); }
}
addEventListener("hashchange", route);
route();
</script>
